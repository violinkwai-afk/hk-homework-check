name = "hk-homework-check"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Retained logs, not just live `wrangler tail` -- mark_usage (and every
# other structured console.log line) previously existed only for whoever
# happened to be tailing at the exact moment a request fired. This makes
# per-image OpenRouter token usage queryable after the fact instead of
# lost the instant the request completes.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./website"
binding = "ASSETS"

[[secrets_store_secrets]]
binding = "ANTHROPIC_API_KEY"
store_id = "50b964b41eeb46d3bd4be77e059d3324"
secret_name = "Nn"

[[secrets_store_secrets]]
binding = "GOOGLE_VISION_API_KEY"
store_id = "50b964b41eeb46d3bd4be77e059d3324"
secret_name = "GOOGLE_VISION_API_KEY"

# DeepSeek-first grading (callDeepSeek in worker.js) is fully optional --
# handleCheckInner checks openrouterKey and falls back straight to Sonnet
# when it's absent, so leaving this secret unset is safe and just means
# "Sonnet only", not a broken deploy. Only activates once a real
# OPENROUTER_API_KEY value is created for this secret name in the same
# Secrets Store via the Cloudflare dashboard (this repo's read-only deploy
# token can declare the binding here but can't create the secret value).
[[secrets_store_secrets]]
binding = "OPENROUTER_API_KEY"
store_id = "50b964b41eeb46d3bd4be77e059d3324"
secret_name = "OPENROUTER_API_KEY"

# Telegram MVP (2026-09-22): /telegram-webhook needs both of these to do
# anything -- handleTelegramWebhook fails closed (503) on either being
# unset, same convention as the keys above. Neither secret_name exists in
# the Secrets Store yet (same situation OPENROUTER_API_KEY was in before
# it was created via the dashboard -- see that comment above): these
# bindings declare the wiring, they don't create the values. No real
# token/secret value is written here or anywhere in this repo.
[[secrets_store_secrets]]
binding = "TELEGRAM_BOT_TOKEN"
store_id = "50b964b41eeb46d3bd4be77e059d3324"
secret_name = "TELEGRAM_BOT_TOKEN"

# Compared against Telegram's X-Telegram-Bot-Api-Secret-Token header (set
# via setWebhook's own secret_token parameter) so /telegram-webhook can't
# be driven by anyone who merely learns the URL. This is a value we mint
# ourselves (any long random string), not something Telegram issues.
[[secrets_store_secrets]]
binding = "TELEGRAM_WEBHOOK_SECRET"
store_id = "50b964b41eeb46d3bd4be77e059d3324"
secret_name = "TELEGRAM_WEBHOOK_SECRET"

# IMPORTANT -- learned the hard way: this Worker auto-deploys from git, and
# Cloudflare's dashboard-added bindings are NOT version-controlled -- every
# new deployment resets bindings to exactly what's declared in this file,
# silently dropping anything added only via the dashboard (this is why the
# RATE_LIMIT_KV binding below still needs its real "id" filled in: it was
# briefly bound via the dashboard and got wiped by the very next git push).
# Never assume a dashboard-added binding survives -- put it here.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "bf66afcfd7694677be3cef507edea155"
