name = "hk-homework-check"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "./website"
binding = "ASSETS"

[[secrets_store_secrets]]
binding = "ANTHROPIC_API_KEY"
store_id = "50b964b41eeb46d3bd4be77e059d3324"
secret_name = "Nn"

# GOOGLE_VISION_API_KEY is NOT declared here on purpose -- it's a plain
# per-project key (not shared with hk-maths like the Anthropic one above),
# so it goes in via Cloudflare dashboard -> this Worker -> Settings ->
# Bindings -> Add binding -> Secret (plain text), variable name
# GOOGLE_VISION_API_KEY. Never put the real key in this file -- this repo is
# public. Optional: refineWithOcr() in src/worker.js just falls back to the
# model's own bbox estimate if this binding isn't present.

# RATE_LIMIT_KV is also dashboard-only (Add binding -> KV Namespace),
# following the same pattern as the sibling hk-maths project.
