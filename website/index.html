<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影相對功課</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<style>
  :root{
    --ink:#3a2b2e; --muted:#9c8288; --card:#ffffff;
    --pink:#f28ba0; --pink-soft:#fbd9df; --pink-ink:#c23f5b;
    --yellow:#f6c453; --yellow-soft:#fdedc7;
    --good:#3fae5c; --bad:#e0483e; --unsure:#e0a13a;
    --shadow: 0 2px 10px rgba(58,43,46,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg, #fcf2f3 0%, #fffbea 55%, #fffbea 100%);
    background-attachment:fixed;
    font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    padding-inline:16px; padding-block:20px 40px;
  }
  .page{max-width:460px; margin:0 auto;}
  .brand{font-weight:800; font-size:1.3rem; color:var(--pink-ink); text-align:center; margin-bottom:2px;}
  h1{font-size:1.15rem; text-align:center; margin:0 0 4px; font-weight:800;}
  .sub{font-size:.85rem; color:var(--muted); text-align:center; margin:0 0 20px; line-height:1.55;}

  .card{background:var(--card); border-radius:20px; padding:18px; box-shadow:var(--shadow); margin-bottom:16px;}

  .shots{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .shot{position:relative; width:72px; height:96px; border-radius:12px; overflow:hidden; box-shadow:var(--shadow);}
  .shot img{width:100%; height:100%; object-fit:cover; display:block;}
  .shot .rm{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none; font-size:12px; line-height:20px; padding:0;}
  .addbtn{width:72px; height:96px; border-radius:12px; border:2px dashed var(--pink-soft); background:#fff8f9; color:var(--pink-ink); font-size:1.6rem; font-weight:800;}

  button.big{
    width:100%; padding:15px; border-radius:16px; border:none; font-family:inherit;
    font-weight:800; font-size:1rem; cursor:pointer; box-shadow:var(--shadow);
  }
  .btn-primary{background:var(--pink); color:#fff;}
  .btn-primary:disabled{background:#e9c4cd; color:#fff8; cursor:default;}
  .btn-secondary{background:#fff; color:var(--ink); border:1.5px solid var(--pink-soft) !important;}

  .status{text-align:center; font-size:.85rem; color:var(--muted); margin:10px 0; display:flex; align-items:center; justify-content:center; gap:8px;}
  .status .spinner{width:16px; height:16px; border-radius:50%; border:2.5px solid var(--pink-soft); border-top-color:var(--pink-ink); animation:spin .8s linear infinite; flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .status .spinner{animation:none;} }
  .status.err{color:var(--bad); font-weight:700;}

  .result-page{margin-bottom:18px;}
  .result-page .imgwrap{position:relative; border-radius:14px; overflow:hidden; box-shadow:var(--shadow); line-height:0;}
  .result-page img{width:100%; display:block;}
  .result-page.pending .imgwrap{opacity:.55;}
  .result-page .page-spinner{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .result-page .page-spinner .spinner{width:28px; height:28px; border-radius:50%; border:3px solid var(--pink-soft); border-top-color:var(--pink-ink); animation:spin .8s linear infinite;}
  @media (prefers-reduced-motion: reduce){ .result-page .page-spinner .spinner{animation:none;} }
  .mark{
    position:absolute; display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:400; transform:translate(0,0);
    filter:drop-shadow(0 1px 1.5px rgba(255,255,255,.9)); cursor:pointer; line-height:1;
    padding:10px; margin:-10px; /* bigger invisible tap target than the visible stroke */
  }
  .mark:active{transform:translate(0,0) scale(0.85);}
  .mark svg{display:block;}
  .mark.good{color:var(--bad);} /* real teacher red-pen marks: check and cross are both red, only the shape differs */
  .mark.bad{color:var(--bad);}
  .mark.unsure{color:var(--unsure); font-weight:700; font-size:26px; text-shadow:0 1px 2px rgba(255,255,255,.9);}
  .mark-answer{
    position:absolute; transform:translate(20px,-60%); white-space:nowrap;
    background:#fff; color:var(--bad); font-weight:800; font-size:.78rem;
    padding:1px 5px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.3);
  }

  .score-banner{text-align:center; font-weight:800; font-size:1.2rem; margin:14px 0 6px; color:var(--pink-ink);}
  .weak-areas{font-size:.82rem; color:var(--muted); text-align:center; margin-bottom:10px;}

  .confirm-list{margin-top:6px;}
  .confirm-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--yellow-soft); border-radius:12px; padding:9px 12px; margin-bottom:8px; font-size:.85rem;
  }
  .confirm-item .q{font-weight:700;}
  .confirm-item .btns{display:flex; gap:6px; flex-shrink:0;}
  .confirm-item button{
    padding:6px 12px; border-radius:9px; border:none; font-weight:800; font-size:.8rem; font-family:inherit; cursor:pointer;
  }
  .confirm-item .ok{background:var(--good); color:#fff;}
  .confirm-item .no{background:var(--bad); color:#fff;}

  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:700; margin-bottom:16px;}
  .limit-banner{background:var(--yellow-soft); border-radius:12px; padding:10px 12px; font-size:.8rem; text-align:center; margin-bottom:14px; color:#7a5a1f;}
  .hw-profile{display:flex; align-items:flex-start; gap:8px; font-size:.76rem; color:var(--muted); margin-top:12px; line-height:1.5;}
  .hw-profile input{margin-top:2px; flex-shrink:0;}
  .hw-profile .forget{color:var(--pink-ink); text-decoration:underline; background:none; border:none; padding:0; font:inherit; cursor:pointer;}
</style>
</head>
<body>
<div class="page">
  <div class="brand">影相對功課 ♥</div>
  <h1>影完相，AI即刻幫你剔同交叉</h1>
  <p class="sub">影低小朋友做完嘅功課（唔限本網站出嘅卷，乜嘢功課都得），AI會自己諗答案，同你張相標返啱同錯。</p>

  <div id="limitBanner" class="limit-banner" hidden></div>

  <div class="card" id="uploadCard">
    <div class="shots" id="shots"></div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button class="big btn-primary" id="submitBtn" disabled>影相對功課</button>
    <label class="hw-profile">
      <input type="checkbox" id="rememberHwToggle">
      <span id="hwProfileLabel">記住呢個小朋友嘅字跡，幫AI下次睇得更準（唔開都一樣用得，隨時可以<button type="button" class="forget" id="forgetHwBtn">忘記已記住嘅字跡</button>）</span>
    </label>
  </div>

  <div id="statusMsg" class="status" hidden></div>

  <div id="results"></div>

  <div id="againWrap" hidden>
    <button class="big btn-secondary" id="againBtn">再影過</button>
  </div>

  <div style="text-align:center; margin-top:18px;">
    <a href="terms.html" style="color:var(--muted); font-size:.78rem; text-decoration:underline;">使用條款及免責聲明</a>
  </div>
</div>

<script>
const MAX_PAGES = 5;
// Soft UX guardrail only (not real abuse prevention -- that's the server-side
// per-IP hourly limit in worker.js). Sized for realistic daily homework
// volume: ~12 pages/day at up to 5 pages/submission needs 3+ submissions/day,
// i.e. 90+/month just for normal use -- 30 was carried over from a
// lower-volume context and was too tight.
const MAX_SUBMISSIONS_PER_MONTH = 120;
let shots = []; // { dataUrl, base64 }
// One id per distinct photo set, sent to the server so a retry (network
// blip, or the fetch failing after the server already finished work) can be
// recognised as "the same submission" instead of re-running the AI pipeline
// (and paying for it) a second time. Reset whenever the photo set actually
// changes (see renderShots) or after a submission succeeds.
// A ?demoId=... URL param overrides the very first requestId -- used only
// to drive a real demo of this exact page/UI against a pre-solved result
// cached server-side under that id (see /api/test-noai-check), so the
// real interface can be tried end-to-end without spending on that
// specific request.
let requestId = new URLSearchParams(location.search).get('demoId') || null;

// Handwriting profile: fully opt-in (checkbox defaults unchecked, and its
// state is remembered so a parent who turns it on doesn't have to re-tick
// it every time). deviceId is a random id kept only in this browser's
// localStorage -- never sent anywhere until the checkbox is actually on.
function getOrCreateDeviceId(){
  try {
    let id = localStorage.getItem('hwcheck_device_id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2)));
      localStorage.setItem('hwcheck_device_id', id);
    }
    return id;
  } catch(e) { return null; }
}
const rememberHwToggle = document.getElementById('rememberHwToggle');
const forgetHwBtn = document.getElementById('forgetHwBtn');
try { rememberHwToggle.checked = localStorage.getItem('hwcheck_remember_hw') === '1'; } catch(e){}
rememberHwToggle.onchange = () => {
  try { localStorage.setItem('hwcheck_remember_hw', rememberHwToggle.checked ? '1' : '0'); } catch(e){}
};
forgetHwBtn.onclick = async (e) => {
  e.preventDefault();
  const id = getOrCreateDeviceId();
  forgetHwBtn.textContent = '刪除緊...';
  try {
    await fetch('/api/forget-handwriting', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ deviceId: id }),
    });
  } catch(e){}
  try { localStorage.removeItem('hwcheck_remember_hw'); } catch(e){}
  rememberHwToggle.checked = false;
  forgetHwBtn.textContent = '已忘記';
  setTimeout(() => { forgetHwBtn.textContent = '忘記已記住嘅字跡'; }, 2000);
};

const shotsEl = document.getElementById('shots');
const fileInput = document.getElementById('fileInput');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('statusMsg');
const resultsEl = document.getElementById('results');
const againWrap = document.getElementById('againWrap');
const uploadCard = document.getElementById('uploadCard');

// Does NOT reset requestId itself -- called once at page load too (where a
// ?demoId= override must survive), so callers that actually change the
// photo set reset requestId themselves right before calling this.
function renderShots(){
  shotsEl.innerHTML = '';
  shots.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'shot';
    div.innerHTML = `<img src="${s.dataUrl}"><button class="rm" data-i="${i}">×</button>`;
    shotsEl.appendChild(div);
  });
  if (shots.length < MAX_PAGES){
    const add = document.createElement('button');
    add.className = 'addbtn';
    add.textContent = '+';
    add.onclick = () => fileInput.click();
    shotsEl.appendChild(add);
  }
  submitBtn.disabled = shots.length === 0;
  shotsEl.querySelectorAll('.rm').forEach(btn => {
    btn.onclick = () => { shots.splice(+btn.dataset.i, 1); requestId = null; renderShots(); };
  });
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1600;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      resolve({ dataUrl, base64: dataUrl.split(',')[1] });
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

fileInput.onchange = async () => {
  const files = Array.from(fileInput.files || []).slice(0, MAX_PAGES - shots.length);
  for (const f of files) {
    try { shots.push(await fileToBase64(f)); } catch(e){}
  }
  fileInput.value = '';
  requestId = null;
  renderShots();
};

function checkMonthlyLimit(){
  try {
    const key = 'hwcheck_submissions';
    const now = Date.now();
    const list = (JSON.parse(localStorage.getItem(key) || '[]')).filter(t => now - t < 30*24*3600*1000);
    const banner = document.getElementById('limitBanner');
    if (list.length >= MAX_SUBMISSIONS_PER_MONTH) {
      banner.textContent = `本月已用完 ${MAX_SUBMISSIONS_PER_MONTH} 次免費檢查次數，下個月再嚟啦。`;
      banner.hidden = false;
      return false;
    }
    if (list.length >= MAX_SUBMISSIONS_PER_MONTH - 5) {
      banner.textContent = `本月仲有 ${MAX_SUBMISSIONS_PER_MONTH - list.length} 次檢查次數。`;
      banner.hidden = false;
    }
    return true;
  } catch(e){ return true; }
}
function recordSubmission(){
  try {
    const key = 'hwcheck_submissions';
    const now = Date.now();
    const list = (JSON.parse(localStorage.getItem(key) || '[]')).filter(t => now - t < 30*24*3600*1000);
    list.push(now);
    localStorage.setItem(key, JSON.stringify(list));
  } catch(e){}
}
checkMonthlyLimit();

function markClass(correct){
  if (correct === true) return 'good';
  if (correct === false) return 'bad';
  return 'unsure';
}
function markIcon(correct){
  // Hand-drawn-looking pen strokes (curved, tapered via round linecaps) so
  // marks read as "red pen check", not a typeset glyph.
  if (correct === true) {
    return '<svg width="34" height="30" viewBox="0 0 34 30"><path d="M2,15 Q8,22 13,25 Q20,10 32,3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  if (correct === false) {
    return '<svg width="28" height="28" viewBox="0 0 28 28"><path d="M3,3 Q14,13 25,25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M25,3 Q14,13 3,25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  }
  return '?';
}

// Pages are now graded by independent, parallel requests (see
// submitBtn.onclick below) so each page's marked-up result can appear the
// moment IT finishes, instead of the parent waiting for every page in one
// big request. This builds an empty "pending" slot per page up front, in
// the right order, then fillPageResult() below drops each page's real
// marks in as its own request resolves -- slots fill out of order exactly
// as fast as each page actually finishes, but always stay visually in
// their original page order.
function renderResultShells(){
  resultsEl.innerHTML = '';
  shots.forEach((s, pIdx) => {
    const wrap = document.createElement('div');
    wrap.className = 'result-page pending';
    wrap.dataset.page = pIdx;
    wrap.innerHTML = `<div class="imgwrap"><img src="${s.dataUrl}"><div class="page-spinner"><span class="spinner"></span></div></div>`;
    resultsEl.appendChild(wrap);
  });
  const scoreBanner = document.createElement('div');
  scoreBanner.className = 'score-banner';
  resultsEl.appendChild(scoreBanner);
  const list = document.createElement('div');
  list.className = 'confirm-list';
  resultsEl.appendChild(list);
  uploadCard.hidden = true;
  againWrap.hidden = false;
}

// Fills in one page's slot once that page's own request has resolved.
// `data` is the single shared results object accumulated across all pages
// (so mark-tap/confirm handlers below keep working against the whole set,
// same as before this page split).
function fillPageResult(data, pIdx){
  const wrap = resultsEl.querySelector(`.result-page[data-page="${pIdx}"]`);
  if (!wrap) return;
  wrap.classList.remove('pending');
  const pageItems = (data.results || []).filter(r => (r.page || 0) === pIdx);
  const marksHtml = pageItems.map((r, ri) => {
    if (!r.bbox) return '';
    const cx = (r.bbox.x || 0) + (r.bbox.w || 0);
    const cy = (r.bbox.y || 0) + (r.bbox.h || 0);
    const mark = `<div class="mark ${markClass(r.correct)}" style="left:${cx}%; top:${cy}%;" data-page="${pIdx}" data-idx="${ri}">${markIcon(r.correct)}</div>`;
    const ans = (r.correct === false && r.correctAnswer)
      ? `<div class="mark-answer" style="left:${cx}%; top:${cy}%;" data-page="${pIdx}" data-idx="${ri}">${r.correctAnswer}</div>`
      : '';
    return mark + ans;
  }).join('');
  const img = wrap.querySelector('img');
  wrap.querySelector('.imgwrap').innerHTML = `<img src="${img.src}">${marksHtml}`;
  wrap.querySelectorAll('.mark').forEach(el => {
    el.onclick = () => toggleMarkOnPhoto(data, +el.dataset.page, +el.dataset.idx);
  });
  updateSummary(data);
}

function markPageFailed(pIdx, message){
  const wrap = resultsEl.querySelector(`.result-page[data-page="${pIdx}"]`);
  if (!wrap) return;
  wrap.classList.remove('pending');
  wrap.querySelector('.imgwrap').insertAdjacentHTML('beforeend', `<div class="page-spinner"><span class="sub" style="background:#fff; padding:6px 10px; border-radius:8px;">${message}</span></div>`);
}

// Re-draws the running score banner and the "?" confirm-list from whatever
// is in `data.results` so far -- called after every page fills in, so both
// stay live as pages keep arriving instead of only appearing once at the
// very end.
function updateSummary(data){
  const scoreBanner = resultsEl.querySelector('.score-banner');
  if (scoreBanner) {
    const graded = (data.results || []).filter(x => x.correct !== null);
    const correctCount = graded.filter(x => x.correct === true).length;
    data.score = graded.length ? `${correctCount} / ${graded.length}` : '';
    scoreBanner.textContent = data.score ? `分數：${data.score}` : '';
  }

  const list = resultsEl.querySelector('.confirm-list');
  if (!list) return;
  const unsureItems = (data.results || []).filter(r => r.correct === null);
  if (!unsureItems.length) { list.innerHTML = ''; return; }
  list.innerHTML = `<div class="sub" style="margin-bottom:8px;">相上面「?」嘅幾題AI睇得唔清楚，得閒可以撳一撳確認，唔撳都冇問題：</div>` +
    unsureItems.map((r) => `
      <div class="confirm-item" data-page="${r.page}" data-q="${r.question}">
        <span class="q">第${(r.page||0)+1}頁 · ${r.question}題</span>
        <span class="btns">
          <button class="ok">啱</button>
          <button class="no">錯</button>
        </span>
      </div>`).join('');
  list.querySelectorAll('.confirm-item').forEach(item => {
    const page = +item.dataset.page, q = item.dataset.q;
    const idx = findResultIdx(data, page, q);
    item.querySelector('.ok').onclick = () => applyMarkCorrect(data, page, idx, true);
    item.querySelector('.no').onclick = () => applyMarkCorrect(data, page, idx, false);
  });
}
function findResultIdx(data, page, question){
  const pageItems = (data.results || []).filter(x => (x.page||0) === page);
  return pageItems.findIndex(x => String(x.question) === String(question));
}

// Tapping a mark on the photo flips it -- true/false swap directly; an
// unresolved "?" resolves to true on first tap (a second tap then flips it
// to false like any other mark), since a bare tap can't distinguish "mark
// as correct" from "mark as wrong" the way the confirm-list's two buttons
// can for genuinely ambiguous items.
function toggleMarkOnPhoto(data, page, idx){
  const pageItems = (data.results || []).filter(x => (x.page||0) === page);
  const r = pageItems[idx];
  if (!r) return;
  applyMarkCorrect(data, page, idx, r.correct === true ? false : true);
}

function applyMarkCorrect(data, page, idx, correct){
  const pageItems = (data.results || []).filter(x => (x.page||0) === page);
  const r = pageItems[idx];
  if (!r) return;
  r.correct = correct;

  const markEl = document.querySelector(`.mark[data-page="${page}"][data-idx="${idx}"]`);
  if (markEl) {
    markEl.className = 'mark ' + markClass(correct);
    markEl.innerHTML = markIcon(correct);
  }
  const ansEl = document.querySelector(`.mark-answer[data-page="${page}"][data-idx="${idx}"]`);
  if (correct === false && r.correctAnswer && !ansEl && markEl) {
    const div = document.createElement('div');
    div.className = 'mark-answer';
    div.style.left = markEl.style.left;
    div.style.top = markEl.style.top;
    div.textContent = r.correctAnswer;
    markEl.parentNode.appendChild(div);
  } else if (correct !== false && ansEl) {
    ansEl.remove();
  }

  // recompute score
  const graded = data.results.filter(x => x.correct !== null);
  const correctCount = graded.filter(x => x.correct === true).length;
  data.score = `${correctCount} / ${graded.length}`;
  const banner = document.querySelector('.score-banner');
  if (banner) banner.textContent = `分數：${data.score}`;

  // this item is resolved now -- drop its row from the confirm-list if it had one
  document.querySelectorAll('.confirm-item').forEach(item => {
    if (+item.dataset.page === page && String(item.dataset.q) === String(r.question)) item.remove();
  });
}

// Cycling messages so the wait reads as active progress, not a frozen
// screen -- there's no real per-stage signal from the server (one request/
// response), so this is an honest "still working" heartbeat rather than a
// literal progress bar. Timed roughly to how long each real stage tends to
// take; the last message repeats if it somehow runs long instead of
// implying something's wrong.
function genId(){ return crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2)); }

// Each page is now its own independent request, fired in parallel with the
// others (not one-after-another) -- with up to 5 pages, waiting for them
// sequentially could easily take much longer than people are willing to
// wait, and a parent doesn't need to see page 1 before page 2 starts; each
// page's own marked-up result appears the moment ITS request finishes,
// filling in whichever pending slot is that page's, regardless of finish
// order. The tradeoff: because pages are graded independently and at the
// same time, one page's result can't factor in another page's answer
// (no cross-page consistency-checking) -- a real accuracy tradeoff made
// deliberately for speed.
submitBtn.onclick = async () => {
  if (!shots.length) return;
  if (!checkMonthlyLimit()) return;
  submitBtn.disabled = true;
  recordSubmission(); // once per batch, not per page
  renderResultShells();
  statusEl.hidden = false;
  statusEl.className = 'status';
  statusEl.innerHTML = '<span class="spinner"></span><span>AI檢查緊，逐頁載入緊...</span>';

  const rememberHandwriting = !!rememberHwToggle.checked;
  const deviceId = rememberHandwriting ? getOrCreateDeviceId() : null;
  const currentData = { results: [], score: '' };
  let anySuccess = false, anyError = false;

  await Promise.all(shots.map(async (s, pIdx) => {
    try {
      // Stable per-photo id (not regenerated each click) so retrying the
      // same batch after a network blip on one page hits that page's
      // idempotency cache server-side instead of paying for it twice. Page
      // 0 honours a ?demoId= override (see `requestId` above) so the demo
      // mechanism still works now that submissions are per-page.
      if (!s.requestId) {
        s.requestId = (pIdx === 0 && requestId) ? requestId : genId();
        if (pIdx === 0) requestId = null; // demoId (if any) only ever applies to the first submission
      }
      const res = await fetch('/api/check', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          images: [{ data: s.base64, mediaType: 'image/jpeg' }],
          pageIndex: pIdx,
          requestId: s.requestId,
          deviceId, rememberHandwriting,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        anyError = true;
        markPageFailed(pIdx, data.message || '呢頁檢查失敗');
        return;
      }
      anySuccess = true;
      currentData.results = currentData.results.concat(data.results || []);
      fillPageResult(currentData, pIdx);
    } catch (e) {
      anyError = true;
      markPageFailed(pIdx, '呢頁網絡錯誤');
    }
  }));

  statusEl.hidden = true;
  submitBtn.disabled = false; // re-enable in case they want to start an unrelated new batch, even while reviewing this one
  if (!anySuccess && anyError) {
    statusEl.hidden = false;
    statusEl.className = 'status err';
    statusEl.textContent = '網絡錯誤，請再試一次。';
  }
};

document.getElementById('againBtn').onclick = () => {
  shots = [];
  requestId = null;
  renderShots();
  resultsEl.innerHTML = '';
  uploadCard.hidden = false;
  againWrap.hidden = true;
  statusEl.hidden = true;
};

renderShots();
</script>
</body>
</html>
